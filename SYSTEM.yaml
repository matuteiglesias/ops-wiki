# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: ops.execution.docs
repository:
  id: repo.ops-wiki
  github: matuteiglesias/ops-wiki
domain: operations
system: ops.execution
role: execution-doctrine-docs
lifecycle: active
authority:
  status: declared
  owns:
  - documentation of Ops execution doctrine
  - documentation of Office-to-Ops authority and handoff boundaries
  - durable conceptual vocabulary such as VACChain and Endpoint
  - documentation motif registries for reusable work/operator names
  - human block, evidence, stop-rule, closure, and re-entry conventions
  does_not_own:
  - canonical operational Front Registry or Carry State
  - operator runtime authorization or operator_contract_v2
  - Office compile runtime or generated Office state
  - GitHub repository registry, lifecycle, topology, or readiness authority
  - weekly cadence, horizon, or human-board state
  - Event & Institutional Frontier state
  - runtime execution records merely because their format is documented here
interfaces:
  consumes:
  - Control Tower v2 architecture contracts
  - office-auto-lab Office v2 runtime contracts
  produces:
  - public execution doctrine
  - conceptual vocabulary
  - documentation motif registries
upstream:
- system.office.control-tower
- system.office.runtime
downstream:
- weekly governance documentation
- human and agent readers
canonical_commands: []
generated_paths: []
verification:
  status: documentation-only
  last_verified: '2026-09-22'
  command: null
  unknowns:
  - documentation motif registries are intentionally non-authoritative for runtime powers
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
